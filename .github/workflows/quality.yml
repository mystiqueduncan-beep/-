name: Resume source quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resume facts, links, resources and SEO
        run: |
          python3 _qa/check.py
          python3 _qa/editorial_content.py
          python3 _qa/favicon_consistency.py
      - name: Mobile font character coverage
        run: python3 _qa/mobile_font_subset.py --check
      - name: Verify external resource and new-tab safety
        run: python3 _qa/resource_security.py
      - name: JavaScript syntax
        run: |
          node --check assets/ai-assistant.js
          node --check assets/contact.js
          node --check assets/trend-marquee.js
          node --check assets/regional-analysis.js
          node --check assets/mk-inspired.js
          node --check assets/research-cta.js
          node --check assets/view-router.js
          node --check assets/career-images.js
          node --check assets/page-transitions.js
          node --check assets/view-mode-switch.js
          node --check assets/contact-portrait-reveal.js
      - name: Automatic device routing and manual override tests
        run: node --test _qa/device-routing.test.cjs _qa/view-selector.test.cjs
      - name: Desktop marquee interaction regression
        run: node --test _qa/marquee-interaction.test.cjs _qa/trend-charts.test.cjs
      - name: HTML structure
        run: npx --yes --package=html-validate@11.18.0 html-validate --config _qa/htmlvalidate.json *.html mobile/*.html

  browser-accessibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install browser audit dependencies
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
          npm install --no-save --package-lock=false axe-core@4.10.3
      - name: Portfolio AI chat interactions, routing and responsive access
        run: python3 _qa/ai-assistant_browser.py
      - name: One-time section and contact reveals
        run: python3 _qa/section_reveal_audit.py
      - name: Cross-page research CTA frame, reveal, glow, and accessibility
        run: python3 _qa/research_cta_audit.py
      - name: Editorial mouse, touch and same-tab transitions
        run: python3 _qa/editorial_interactions.py
      - name: Verify six-page trilingual wording, inline headings and one-time typing
        run: python3 _qa/trilingual_heading_audit.py
      - name: Interactive 90-day roadmap on desktop and mobile
        run: python3 _qa/roadmap_interactions.py
      - name: Research visual grammar, source preservation, keyboard and print
        run: python3 _qa/research_visual_system.py
      - name: Directional arrow reveals, source guardrails and reduced-motion
        run: python3 _qa/research_arrow_reveals.py
      - name: Responsive layouts, keyboard controls and axe
        run: python3 _qa/browser_audit.py --out /tmp/browser-audit --axe node_modules/axe-core/axe.min.js
      - name: Chapter highlights, experience slide and contact-action layout
        run: python3 _qa/chapter-contact-polish_audit.py
      - name: Verify sticky homepage marquee and capture desktop/mobile screenshots
        run: python3 _qa/sticky_nav_preview.py --out /tmp/sticky-nav-preview
      - name: Verify research marquee matches home on desktop and mobile
        run: python3 _qa/research_marquee_preview.py --out /tmp/research-marquee-preview
      - name: Compact marquee banners at six viewport sizes and real input interactions
        run: python3 _qa/marquee_banner_audit.py --out /tmp/marquee-banner-audit
      - name: Upload compact marquee banner acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compact-marquee-banner-review
          path: /tmp/marquee-banner-audit
          if-no-files-found: warn
      - name: Upload research marquee desktop and mobile screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-bilingual-marquee-review
          path: /tmp/research-marquee-preview/*.png
          if-no-files-found: warn
      - name: Upload desktop/mobile navigation screenshots for PR review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sticky-marquee-review
          path: /tmp/sticky-nav-preview/*.png
          if-no-files-found: warn

  release-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install browser
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - name: Prepare unchanged PR baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '5646383cf2ea0bb24201ee18fc51e43540f0d8df' }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          mkdir -p /tmp/resume-before
          git archive "$BASE_SHA" | tar -x -C /tmp/resume-before
      - name: Baseline images and three Lighthouse runs per device
        id: baseline
        continue-on-error: true
        run: python3 _qa/release_audit.py --root /tmp/resume-before --out /tmp/release-audit/before
      - name: Online images, screenshots and three Lighthouse runs per device
        if: always()
        run: python3 _qa/release_audit.py --out /tmp/release-audit/after
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-audit
          path: /tmp/release-audit

  published-site:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Obtain current main when testing an unpublished PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch origin "$BASE_SHA" --depth=1
      - name: Verify ten live pages and exact versioned favicon
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: python3 _qa/live_site_smoke.py
