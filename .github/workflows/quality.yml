name: Resume source quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resume facts, links, resources and SEO
        run: |
          python3 _qa/check.py
          python3 _qa/editorial_content.py
          python3 _qa/favicon_consistency.py
      - name: Mobile font character coverage
        run: python3 _qa/mobile_font_subset.py --check
      - name: JavaScript syntax
        run: |
          node --check assets/contact.js
          node --check assets/trend-marquee.js
          node --check assets/mk-inspired.js
          node --check assets/research-cta.js
          node --check assets/view-router.js
          node --check assets/career-images.js
          node --check assets/page-transitions.js
          node --check assets/view-mode-switch.js
          node --check assets/contact-portrait-reveal.js
      - name: Automatic device routing and manual override tests
        run: node --test _qa/device-routing.test.cjs
      - name: Desktop marquee interaction regression
        run: node --test _qa/marquee-interaction.test.cjs _qa/trend-charts.test.cjs
      - name: HTML structure
        run: npx --yes --package=html-validate@11.18.0 html-validate --config _qa/htmlvalidate.json *.html mobile/*.html

  browser-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install browser audit dependencies
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
          npm install --no-save --package-lock=false axe-core@4.10.3
      - name: One-time section and contact reveals
        run: python3 _qa/section_reveal_audit.py
      - name: Cross-page research CTA frame, reveal, glow, and accessibility
        run: python3 _qa/research_cta_audit.py
      - name: Editorial mouse, touch and same-tab transitions
        run: python3 _qa/editorial_interactions.py
      - name: Responsive layouts, keyboard controls and axe
        run: python3 _qa/browser_audit.py --out /tmp/browser-audit --axe node_modules/axe-core/axe.min.js

  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install browser
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - name: Prepare unchanged PR baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '5646383cf2ea0bb24201ee18fc51e43540f0d8df' }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          mkdir -p /tmp/resume-before
          git archive "$BASE_SHA" | tar -x -C /tmp/resume-before
      - name: Baseline images and three Lighthouse runs per device
        id: baseline
        continue-on-error: true
        run: python3 _qa/release_audit.py --root /tmp/resume-before --out /tmp/release-audit/before
      - name: Online images, screenshots and three Lighthouse runs per device
        if: always()
        run: python3 _qa/release_audit.py --out /tmp/release-audit/after
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit
          path: /tmp/release-audit

  published-site:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Obtain current main when testing an unpublished PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch origin "$BASE_SHA" --depth=1
      - name: Check six live pages and checksum-match ten published assets
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: python3 _qa/live_site_smoke.py
