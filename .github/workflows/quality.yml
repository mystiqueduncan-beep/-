name: Resume source quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resume facts, links, resources and SEO
        run: python3 _qa/check.py
      - name: JavaScript syntax
        run: |
          node --check assets/contact.js
          node --check assets/trend-marquee.js
          node --check assets/mk-inspired.js
          node --check assets/view-router.js
      - name: Automatic device routing and manual override tests
        run: node --test _qa/device-routing.test.cjs
      - name: Desktop marquee interaction regression
        run: node --test _qa/marquee-interaction.test.cjs
      - name: HTML structure
        run: npx --yes --package=html-validate@11.18.0 html-validate --config _qa/htmlvalidate.json *.html mobile/*.html

  browser-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install browser audit dependencies
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
          npm install --no-save --package-lock=false axe-core@4.10.3
      - name: Responsive layouts, keyboard controls and axe
        run: python3 _qa/browser_audit.py --out /tmp/browser-audit --axe node_modules/axe-core/axe.min.js

  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install browser
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - name: Online images, screenshots and Lighthouse
        run: python3 _qa/release_audit.py
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit
          path: /tmp/release-audit
