name: Build downloadable personal résumé PDF

on:
  push:
    branches:
      - main
    paths:
      - resume.html
      - assets/island-stitched-flora.svg
      - _qa/export_resume_pdf.py
      - .github/workflows/resume-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-resume-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Use current branch tip, including intervening source fixes
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
      - name: Install original CJK fonts and PDF renderer
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf" -o "$HOME/.local/share/fonts/NotoSansTC.ttf"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 "https://raw.githubusercontent.com/google/fonts/main/ofl/notoseriftc/NotoSerifTC%5Bwght%5D.ttf" -o "$HOME/.local/share/fonts/NotoSerifTC.ttf"
          fc-cache -f "$HOME/.local/share/fonts"
          python3 -m pip install playwright==1.51.0 pypdf==5.8.0
          python3 -m playwright install --with-deps chromium
      - name: Render and validate two-page A4 PDF
        run: python3 _qa/export_resume_pdf.py
      - name: Commit verified downloadable PDF
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- resume.pdf)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resume.pdf
            git commit -m "Update downloadable A4 personal resume PDF"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "Download file is already synchronized."
          fi
      - name: Preserve validated PDF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-resume-a4-download
          path: resume.pdf
          retention-days: 14
